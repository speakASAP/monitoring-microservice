apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: statex-apps
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      initContainers:
        # The dashboard file-provider (configmap-dashboards.yaml) points at
        # /var/lib/grafana/dashboards. That path lives on the grafana-data PVC and is not
        # created by the image, so without this the provisioner logged
        # "Cannot read directory ... no such file or directory" on every scan (~1100/24h)
        # and no dashboard could ever load.
        - name: init-dashboards-dir
          image: grafana/grafana:10.4.2
          command: ['sh', '-c', 'mkdir -p /var/lib/grafana/dashboards']
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          ports:
            - containerPort: 3000
              name: http
          env:
            # Synced with auth-microservice TEST_EMAIL / TEST_PASSWORD (ecosystem test user)
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-microservice-secret
                  key: TEST_PASSWORD
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: auth-microservice-secret
                  key: TEST_EMAIL
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.alfares.cz
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
