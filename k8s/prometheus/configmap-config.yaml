apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: statex-apps
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter.statex-apps.svc.cluster.local:9100']

      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics:8080']

      # ESO controller metrics. Discovered by pod role: the Helm chart ships no
      # metrics Service, and the pod IP changes on every controller restart.
      - job_name: 'external-secrets'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['external-secrets']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: external-secrets
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          # Deliberately NOT setting `namespace`/`pod` here. ESO's metrics carry
          # their own `namespace`/`name` labels identifying the ExternalSecret;
          # target labels of the same name would collide and Prometheus would
          # rename the real ones to `exported_namespace`, making alert
          # annotations point at the operator's namespace instead of the failing
          # ExternalSecret's. Use `eso_pod` for the scrape source instead.
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: eso_pod

      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - http://auth-microservice:3370/health
            - http://logging-microservice:3367/health
            - http://notifications-microservice:3368/health
            - http://ai-microservice:3380/health
            - http://minio-microservice:9000/minio/health/live
            - http://database-server-frontend:3390/health
            - http://192.168.88.53:8200/v1/sys/health
            - http://monitoring-microservice:3395/health
            - http://monitoring-web:3396/
            - http://catalog-microservice:3200/health
            - http://warehouse-microservice:3201/api/health
            - http://orders-microservice:3203/health
            - http://payments-microservice:3468/health
            - http://suppliers-microservice:3202/api/health
            - http://leads-microservice:4400/health
            - http://marketing-microservice:4600/health
            - http://prompts-microservice:4750/health
            - http://agentic-email-processing-system:3374/health
            - http://allegro-service:3000/health
            - http://aukro-service:3700/health
            - http://bazos-service:3000/health
            - http://heureka-service:3800/health
            - http://runlayer:3390/health
            - http://goalkeeper:3392/health
            - http://flipflop-service:3000/health
            - http://crypto-ai-agent:3000/api/health
            - http://marathon:3000/health
            - http://shop-assistant:4500/health
            - http://school-committee:4800/health
            - http://candidate-blueprism:4850/
            - http://statex:3000/api/health
            - http://statex:3000/api/ecosystem/health
            - http://speakasap:3000/health
            - http://speakasap-content:4201/health
            - http://speakasap-certification:4202/health
            - http://speakasap-assessment:4203/health
            - http://speakasap-course:4205/health
            - http://speakasap-education:4206/health
            - http://speakasap-user:4207/health
            - http://speakasap-payment:4208/health
            - http://speakasap-notification:4209/health
            - http://speakasap-api-gateway:4210/health
            - http://speakasap-salary:4212/health
            - http://speakasap-financial:4213/health
            - http://rehtani:4601/
            - http://statex-ecosystem:4710/api/health
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter:9115

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['statex-apps']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
