apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: statex-apps
data:
  ecosystem.yml: |
    groups:
      - name: service-health
        rules:
          - alert: ServiceDown
            expr: probe_success == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.instance }} is down"
              description: "Service {{ $labels.instance }} unreachable for 2 minutes"

          - alert: HighResponseTime
            expr: probe_duration_seconds > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time on {{ $labels.instance }}"
              description: "Response time exceeds 2s for 5 minutes"

      - name: infrastructure
        rules:
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage"
              description: "Memory usage above 85%"

          - alert: HighDiskUsage
            expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High disk usage"
              description: "Disk usage above 85%"

          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage"
              description: "CPU above 80% for 10 minutes"

      - name: external-secrets
        rules:
          # An ExternalSecret stuck NotReady means the K8s Secret is stale: the
          # consuming pod keeps running on the last-synced values, so nothing
          # crashes and nothing else surfaces this. Sole detector of that state.
          - alert: ExternalSecretSyncFailing
            expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not syncing"
              description: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been Ready=False for 15 minutes. The K8s Secret is stale — consumers still run on the last successfully synced values. Check ESO logs: kubectl -n external-secrets logs deployment/external-secrets"

          # Catches a store-wide outage (Vault sealed/unreachable), which would
          # otherwise fire one alert per ExternalSecret.
          - alert: ClusterSecretStoreNotReady
            expr: clustersecretstore_status_condition{condition="Ready",status="False"} == 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "ClusterSecretStore {{ $labels.name }} not ready"
              description: "ClusterSecretStore {{ $labels.name }} has been Ready=False for 10 minutes. Every ExternalSecret bound to it is failing to sync — usually Vault sealed or unreachable."

          # ESO scrape gone means sync failures stop being observable at all.
          - alert: ExternalSecretsOperatorDown
            expr: up{job="external-secrets"} == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "external-secrets operator metrics unreachable"
              description: "Prometheus cannot scrape the external-secrets controller for 10 minutes. ExternalSecret sync failures are undetectable while this is firing."

      - name: kubernetes
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarting frequently"

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0 and on (namespace, pod) kube_pod_status_phase{phase="Running"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} not ready"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready for 5 minutes"
