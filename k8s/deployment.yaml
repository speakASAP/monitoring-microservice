apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-microservice
  namespace: statex-apps
  labels:
    app: monitoring-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: monitoring-microservice
    spec:
      # Grants the read-only cluster identity defined in k8s/rbac.yaml. Without
      # it the pod falls back to the namespace default account, which cannot
      # list CronJobs, and JobWatcher stays permanently dormant — silently,
      # which is the exact failure mode this lane exists to remove. Apply
      # rbac.yaml before this deployment.
      serviceAccountName: monitoring-microservice
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/monitoring-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3395
              name: http
          envFrom:
            - configMapRef:
                name: monitoring-microservice-config
            - secretRef:
                name: monitoring-microservice-secret
          env:
            # The log ingest endpoint rejects unauthenticated posts with 401, and
            # LoggingService swallows that rejection, so a missing token silently
            # erases this service from the log index (it had zero rows for
            # 2026-08-25..09-04). This reference existed only on the live object
            # and in no manifest, so any full apply from git would have dropped it
            # and re-broken logging invisibly. Keep it here.
            - name: LOGGING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logging-ingest-credentials
                  key: LOGGING_SERVICE_TOKEN
          startupProbe:
            httpGet:
              path: /health
              port: 3395
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3395
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3395
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
