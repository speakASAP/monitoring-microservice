apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-microservice
  namespace: statex-apps
  labels:
    app: monitoring-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: monitoring-microservice
    spec:
      # Grants the read-only cluster identity defined in k8s/rbac.yaml. Without
      # it the pod falls back to the namespace default account, which cannot
      # list CronJobs, and JobWatcher stays permanently dormant — silently,
      # which is the exact failure mode this lane exists to remove. Apply
      # rbac.yaml before this deployment.
      serviceAccountName: monitoring-microservice
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z db-server-postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: app
          image: localhost:5000/monitoring-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3395
              name: http
          envFrom:
            - configMapRef:
                name: monitoring-microservice-config
            - secretRef:
                name: monitoring-microservice-secret
          # LOGGING_SERVICE_TOKEN comes from monitoring-microservice-secret
          # (per-pair RS256 via ExternalSecret). Do not reintroduce the shared
          # logging-ingest-credentials override — it shadows envFrom with a
          # static non-JWT.
          startupProbe:
            httpGet:
              path: /health
              port: 3395
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3395
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3395
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
