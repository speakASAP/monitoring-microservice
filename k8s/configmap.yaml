apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-microservice-config
  namespace: statex-apps
  labels:
    app: monitoring-microservice
data:
  NODE_ENV: "production"
  SERVICE_NAME: "monitoring-microservice"
  DOMAIN: "monitoring.alfares.cz"
  PORT: "3395"
  CORS_ORIGIN: "*"
  DB_HOST: "db-server-postgres"
  DB_PORT: "5432"
  DB_NAME: "monitoring"
  AUTH_SERVICE_URL: "http://auth-microservice.statex-apps.svc.cluster.local:3370"
  LOGGING_SERVICE_URL: "http://logging-microservice.statex-apps.svc.cluster.local:3367"
  NOTIFICATION_SERVICE_URL: "http://notifications-microservice.statex-apps.svc.cluster.local:3368"
  DAILY_DIGEST_ENABLED: "true"
  DAILY_DIGEST_CRON: "0 8 * * *"
  TELEGRAM_CHAT_ID: "694579866"
  # Periodic health sweep that drives alert fire/resolve. Before this, the only
  # recurring health signal was the 08:00 digest, so an 08:30 outage went
  # unreported for 23.5 hours.
  HEALTH_WATCH_ENABLED: "true"
  HEALTH_WATCH_CRON: "*/5 * * * *"
  # CronJob outcome watching. Nothing observed the cluster's 11 CronJobs before
  # this: HealthWatcher polls /health, and a CronJob has neither an endpoint nor
  # a long-running pod. catalog-contract-monitor failed every 30 minutes for
  # four days and raised zero alerts.
  JOB_WATCH_ENABLED: "true"
  # Offset from the :00/:15/:30/:45 grid pod-janitor runs on, so evidence
  # capture is not racing the sweeper that deletes the pods holding it.
  JOB_WATCH_CRON: "7,22,37,52 * * * *"
  JOB_WATCH_NAMESPACES: "statex-apps"
  # Missed runs tolerated before alerting. Transient job failures outnumbered
  # persistent ones ~5:1 over the 8 days before this shipped, so alerting on
  # each failure event would carry that ratio into the channel — and a noisy
  # channel gets muted, which is how the trigger incident stayed invisible.
  JOB_OVERDUE_MULTIPLE: "3"
  # Raised from 40 after the first live capture: 40 lines of a verbose job ended
  # mid-JSON on a trailing skip-list rather than the failure that mattered. The
  # log is read once, at detection, because pod-janitor destroys the pod 120
  # minutes later — so the tail has to be long enough to contain the cause.
  JOB_EVIDENCE_TAIL_LINES: "120"
  # Watches the watchers. Every adapter added here becomes a new blind spot the
  # moment it stops running, so a missed cycle is a critical alert of its own.
  HEARTBEAT_CHECK_ENABLED: "true"
  HEARTBEAT_CHECK_CRON: "*/5 * * * *"
  HEARTBEAT_MISSED_CYCLES: "3"
