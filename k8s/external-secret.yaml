apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitoring-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: JWT_SECRET
    - secretKey: LOGGING_READ_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: LOGGING_READ_SERVICE_TOKEN
    # TASK-KEY-F2: was the shared SERVICE_TOKEN value (global:superadmin, 6 holders).
    # Now this service's own delivery-scoped token. Env var name unchanged so no code change.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: AUTH_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: AUTH_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: MONITORING_INGEST_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: MONITORING_INGEST_SERVICE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: LOGGING_SERVICE_TOKEN
