apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitoring-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: JWT_SECRET
    - secretKey: LOGGING_READ_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: LOGGING_READ_SERVICE_TOKEN
    # TASK-KEY-F2: was the shared SERVICE_TOKEN value (global:superadmin, 6 holders).
    # Now this service's own delivery-scoped token. Env var name unchanged so no code change.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
    # Task E: this service's own per-pair principal
    # (svc-monitoring-microservice--auth-microservice, RS256), used by
    # CredentialWatcher to read the service-principal inventory.
    #
    # Deliberately NOT the shared INTERNAL_SERVICE_TOKEN static string: that
    # credential carries no identity, so a rejection cannot be attributed and it
    # cannot be enumerated -- the watcher would be blind to its own credential.
    # With a real principal it appears in its own matrix and is probed like the
    # fleet it observes.
    - secretKey: AUTH_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: AUTH_SERVICE_TOKEN
    # Auth RS256 ingest principal for /api/alerts/* and /api/credentials/report
    # (role internal:monitoring-microservice:ingest). Replaces static
    # NOTIFICATION_SERVICE_TOKEN / ALERT_INGEST_TOKEN compares on MonitoringIngestGuard.
    # Callers: CredentialSelfReporter, deploy-queue alert-state.sh (in-pod).
    - secretKey: MONITORING_INGEST_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: MONITORING_INGEST_SERVICE_TOKEN
    # Per-pair RS256 ingest credential for monitoring -> logging-microservice
    # (svc-monitoring-microservice--logging-microservice@internal.alfares.cz,
    # role internal:logging-microservice:ingest). Replaces shared
    # logging-ingest-credentials (static non-JWT).
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: LOGGING_SERVICE_TOKEN
