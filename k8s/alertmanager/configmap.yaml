apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: statex-apps
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'monitoring-webhook'
    receivers:
      - name: 'monitoring-webhook'
        webhook_configs:
          - url: 'http://monitoring-microservice:3395/api/webhooks/alertmanager'
            send_resolved: true
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'service']
